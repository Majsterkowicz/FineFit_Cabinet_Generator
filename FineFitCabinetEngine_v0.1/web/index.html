<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FineFit Cabinet Engine</title>
    <link rel="icon" href="data:image/svg+xml,
        %3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E
        %3Crect width='32' height='32' rx='6' fill='%23d99a4e'/%3E
        %3Crect x='7' y='7' width='18' height='18' fill='none'
        stroke='%2314161b' stroke-width='2'/%3E
        %3Cline x1='16' y1='7' x2='16' y2='25' stroke='%2314161b'
        stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <span class="mark"></span>
        <div>
            <h1>FineFit Cabinet Engine</h1>
            <p class="muted">Projektowanie i technologia mebli na wymiar</p>
        </div>
    </div>
    <button class="ghost" id="theme-toggle" title="Motyw">◐</button>
</header>

<main class="layout">

    <aside class="sidebar">
        <div class="sidebar-head">
            <h2>Projekty</h2>
            <button class="primary small" id="new-project">+ Nowy</button>
        </div>
        <div id="project-list" class="project-list"></div>
    </aside>

    <section class="workspace" id="workspace">
        <div class="empty">
            <h2>Wybierz projekt</h2>
            <p class="muted">Wybierz projekt z listy lub utwórz nowy.</p>
        </div>
    </section>

</main>

<div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
